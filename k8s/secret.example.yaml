#
# .gitignore excludes *secret*.yaml and re-includes only this example, so a
# filled-in copy cannot be committed by accident.
#
# stringData takes plain text and the API server base64-encodes it. Note that
# Secrets are encoded, not encrypted, at rest by default — anyone who can read
# the Secret in this namespace can read the value. Real deployments back this
# with a KMS provider, Sealed Secrets, or an external store.
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-credentials
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
type: Opaque
stringData:
  MODEL_REGISTRY_TOKEN: replace-me
---
