# Serving Deployment.
#
# Two replicas of the inference API, each mounting the checkpoint PVC read-only.
# Both pods land on the same node (single-node cluster, ReadWriteOnce volume),
# which is what lets them share a volume the Job wrote.
#
# The deployment can legitimately be applied before training has finished. In
# that case /health returns 503, the readiness probe keeps the pods out of the
# Service, and each pod becomes ready by itself once the checkpoint appears —
# serve.py re-attempts the load on every health call rather than deciding once
# at start-up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0 means capacity never dips below two ready pods during
      # a rollout; maxSurge 1 allows one extra pod while the swap happens.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      securityContext:
        # The image already declares USER 1001; restating it here lets the
        # cluster enforce it rather than trust the image, and fsGroup makes the
        # mounted volume readable by that user.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODEL_CHECKPOINT_PATH
              value: /app/checkpoints/classifier_v1.pt
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          # Readiness gates traffic: a pod without a checkpoint stays out of the
          # Service endpoints instead of returning 503 to callers.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          # A startupProbe suspends the liveness and readiness probes until it
          # succeeds once. Without it the liveness probe kills this pod long
          # before the training Job has written a checkpoint: /health returns
          # 503 until the model loads, so three failures at a 10s period restart
          # the container roughly every minute, forever.
          #
          # 270 failures x 10s allows 45 minutes for the checkpoint to appear.
          # Sized from measurement, not guesswork: on a cold cluster the Job
          # spent 33 minutes downloading CIFAR-10 into an empty dataset PVC
          # before training began, and a pod started alongside it went ready at
          # the 13 minute mark on a warm run. An earlier value of 90 (15 min)
          # left almost no margin.
          #
          # A startupProbe failing is not catastrophic — the pod restarts and
          # tries again — but each restart discards progress toward readiness,
          # so the budget should comfortably exceed worst-case training time.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 270
          # Liveness restarts a genuinely stuck process. It only begins once the
          # startupProbe has passed, so a slow first checkpoint is never treated
          # as a hung server.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoint-pvc
            readOnly: true
